services:
  dataops-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: dataops_demo
      MYSQL_USER: dataops_reader
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - compose-mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  dataops-backend:
    build:
      context: ./backend
    environment:
      MYSQL_HOST: dataops-mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: dataops_demo
      MYSQL_USER: dataops_reader
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      HISTORY_DB_PATH: /app/data/query_history.db
    volumes:
      - compose-history-data:/app/data
    depends_on:
      dataops-mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    expose:
      - "8000"
    restart: unless-stopped

  dataops-frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      dataops-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  compose-mysql-data:
  compose-history-data:
