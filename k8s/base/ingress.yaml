apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataops-ingress
  namespace: dataops-console
spec:
  ingressClassName: nginx
  rules:
    - host: dataops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dataops-frontend
                port:
                  number: 80
