apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataops-backend
  namespace: dataops-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataops-backend
  template:
    metadata:
      labels:
        app: dataops-backend
    spec:
      serviceAccountName: dataops-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: dataops-backend:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dataops-backend-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dataops-backend-secret
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: query-history
              mountPath: /app/data
      volumes:
        - name: query-history
          persistentVolumeClaim:
            claimName: dataops-backend-history
